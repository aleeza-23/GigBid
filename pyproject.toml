[project]
name = "gigbid-student-project"
version = "0.1.0"
description = "Student scaffold for the AI-4016 GigBid assignment"
requires-python = ">=3.12"
# Pinned, as the assignment requires. Versions are the ones the results in
# evals/results/ were produced with; bumping one means re-running the evals.
dependencies = [
  "fastapi==0.162.4",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pyyaml==6.0.3",
  "langgraph==1.2.20",
  "langchain==1.4.10",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  # Core, not an extra: rag/embeddings.py and rag/index/dense.py import it, and both are
  # in the request path for every retrieval the API serves. It used to arrive only as a
  # transitive dependency of pandas or sentence-transformers, so a minimal
  # `pip install -e ".[persistence]"` built a deployment that crashed on the first search.
  "numpy==2.5.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
  "mypy==2.4.1",
]
data = ["pandas==3.1.1", "pyarrow==26.0.1", "kagglehub==1.0.3", "pypdf==7.0.1"]

# Open-weight embeddings and reranker (B2). A large install because it pulls torch, so it
# is an extra rather than a core dependency: the graph, the API and the whole test suite
# run without it on the LSA development backend. Needed for any retrieval number that
# will actually be reported.
rag = ["sentence-transformers==6.3.0", "torch==2.15.0"]

# Durable checkpointing (C6). Without these the only checkpointer is in-memory, which
# loses every pending approval on restart.
persistence = [
  "langgraph-checkpoint-sqlite==3.1.3",
  "aiosqlite==0.22.1",
  "langgraph-checkpoint-postgres==3.2.1",
  "psycopg[binary]==3.3.9",
]

# R&D question C only: the prebuilt-supervisor baseline and a LangChain chat model to
# drive it.
compare = ["langgraph-supervisor==0.0.31", "langchain-openai==1.8.0"]

# Live Upwork mode only: Fernet encryption for the per-user OAuth token store (A4).
# Kept out of the default install so the graded GigSim path needs no crypto library.
live = ["cryptography==50.0.2"]

# Everything needed to reproduce every number in evals/results/.
all = [
  "sentence-transformers==6.3.0", "torch==2.15.0",
  "langgraph-checkpoint-sqlite==3.1.3", "aiosqlite==0.22.1",
  "langgraph-checkpoint-postgres==3.2.1", "psycopg[binary]==3.3.9",
  "langgraph-supervisor==0.0.31", "langchain-openai==1.8.0",
  "cryptography==50.0.2", "pypdf==7.0.1",
]

[project.scripts]
# The Portfolio server is meant to be installable on its own, so it gets a console script
# rather than only `python -m`. `uvx --from <this repo> gigbid-portfolio-mcp` then runs it
# without installing anything permanently.
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"
gigbid-marketplace-mcp = "mcp_servers.marketplace.server:main"
gigbid-workspace-mcp = "mcp_servers.workspace.server:main"
gigbid-worker = "worker.scheduler:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "apps*", "data*", "evals*", "gigsim*", "mcp_servers*", "rag*",
           "tests*", "worker*"]

[tool.ruff]
line-length = 100
# Portfolio corpus code is data for RAG, not project code.
extend-exclude = ["data/personas"]

[tool.ruff.lint]
ignore = [
  # A6 requires a graceful degraded mode, and several places have to survive *any*
  # failure in a dependency rather than propagate it: a broken RAG variant must not take
  # the tool layer down, an unreachable MCP server must not fail the other four, and a
  # failed client cleanup must not mask the error that caused it. Every such site carries
  # a comment saying what it is swallowing and why.
  "BLE001",
  "S110",
  # Same reasoning as S110, in a loop: deleting one memory observation that has already
  # gone must not abort deleting the rest.
  "S112",
  # Multi-line prose inside tuples and lists is deliberate throughout this codebase
  # (tool descriptions, warnings, approval text), not a missing comma.
  "ISC004",
  # A sequence of guard clauses reads better than one inverted boolean return.
  "SIM103",
  # Stopword lists are written as wrapped `"""...""".split()` text. The autofix collapses
  # them into 950-character single-line list literals, which is strictly less readable
  # and unreviewable in a diff.
  "SIM905",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares Query/Body/Header in argument defaults by design.
"gigsim/server.py" = ["B008"]
"apps/api/**" = ["B008"]
# Its `# noqa: BLE001` became redundant when BLE001 moved into the global ignore list
# above. Ignored here rather than edited, to keep gigsim/ untouched.
"gigsim/llm_client.py" = ["RUF100"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# The MCP server tests live beside the servers they cover (the layout the assignment
# asks for), so they have to be named here or CI silently skips them.
testpaths = ["tests", "mcp_servers"]
