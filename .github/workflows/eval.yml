name: Eval gate

# E2: a smoke eval on every pull request, failing if quality drops past the thresholds in
# evals/thresholds.json.
#
# Separate from ci.yml because it answers a different question. CI asks "does the code
# work"; this asks "did the system get worse". They fail for different reasons and a
# reviewer should be able to tell which at a glance.

on:
  pull_request:
  push:
    branches: [master, main]
  # Quality can regress without any code change — a prompt edit, a threshold tweak, a
  # dependency bump. A nightly run catches drift that no pull request introduced.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # No torch. The gate runs on the lightweight retrieval backends, so it measures
        # regression against a fixed configuration rather than absolute quality — which
        # is what a gate is for, and what keeps it under a minute.
        run: python -m pip install -e ".[dev,data,persistence]"

      - name: Ingest the corpus
        run: python -m rag.ingest.pipeline --all

      - name: Decision quality gate (30 stratified jobs)
        # Stratified across in-domain, off-domain, scam, injection and duplicate jobs.
        # Taking the first 30 rows would be 30 in-domain jobs and the scam and injection
        # gates would read 0.0 with nothing to detect.
        run: python -m evals.runners.smoke_eval --limit 30

      - name: Claim verification has not regressed
        # The unsupported-claim rate is the R5 metric. Checked directly rather than
        # through the decision eval, because it needs a draft rather than a decision.
        run: pytest tests/unit/test_claim_verification.py -q

      - name: Injection defence
        run: pytest tests/integration/test_conversation_graph.py -q -k inject

      - name: Exactly-once still holds
        # C6's guarantee is the one regression that costs real money, so it is gated
        # rather than merely tested somewhere in the suite.
        run: pytest tests/integration/test_bid_graph.py -q -k "exactly_once or crash or in_flight"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          retention-days: 30

      - name: Comment the gate result on the pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'evals/results/smoke_eval.json';
            if (!fs.existsSync(path)) return;
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const rows = report.checks
              .map(c => `| ${c.metric} | ${c.measured ?? '—'} | ${c.bound ?? '—'} | ${c.status} |`)
              .join('\n');
            const body = [
              `### Eval gate: ${report.passed ? 'passed' : 'FAILED'}`,
              '',
              `${report.jobs} stratified dev jobs, retrieval ${report.variant}.`,
              '',
              '| Metric | Measured | Bound | |',
              '|---|---|---|---|',
              rows,
              '',
              `_${report.configuration}_`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python
        run: python -m pip install -e ".[dev,data,persistence]"

      - name: Install web
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Generate the API client from the OpenAPI schema
        # Generated, not hand-written, as Part D requires. Regenerating here means a
        # drifted schema fails the build rather than reaching the browser.
        run: |
          python -c "import json; from apps.api.main import app; open('openapi.json','w').write(json.dumps(app.openapi(), indent=2))"
          cd apps/web && npx openapi-typescript ../../openapi.json -o src/lib/api/schema.d.ts
          git diff --exit-code src/lib/api/schema.d.ts \
            || (echo "::error::the generated API client is stale; run npm run generate:api and commit it" && exit 1)

      - name: Ingest the corpus
        # The seed data and dev set are committed; the chunked index is built, and the
        # Fit Matcher has nothing to retrieve from without it.
        run: python -m rag.ingest.pipeline --all

      - name: Typecheck and build
        working-directory: apps/web
        run: |
          npx tsc --noEmit
          npm run build

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Playwright
        id: suite
        # Report-only, deliberately. The specs drive a three-process stack with real
        # retrieval, and a CI runner is slower and noisier than a laptop, so a timeout
        # here says the runner was busy rather than that approval stopped working. The
        # report is uploaded either way, and the properties that must never regress
        # (exactly-once spending, injection defence, claim verification) are gated in the
        # smoke-eval job above, where a failure does fail the build.
        continue-on-error: true
        working-directory: apps/web
        # The config starts GigSim, the API and Next itself, on private ports so the suite
        # cannot adopt a server somebody left running.
        run: npx playwright test --project=desktop
        env:
          CI: "true"
          GIGSIM_API_TOKEN: gigsim-dev-token
          APP_SECRET_KEY: ci-secret-not-a-real-key
          REVIEWER_PASSWORD: reviewer

      - name: Say what happened
        if: always()
        run: |
          if [ "${{ steps.suite.outcome }}" = "success" ]; then
            echo "::notice::end-to-end journeys passed"
          else
            echo "::warning::the end-to-end suite did not pass. Download the"
            echo "::warning::playwright-report artifact; it holds a trace per failure."
          fi

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 30
