name: CI
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # Deliberately not ".[all]": that pulls torch, which is a ~250MB download on
        # every run to test code paths the conftest already forces onto the lightweight
        # LSA and lexical backends. Reproducing the reported numbers needs ".[all]";
        # checking the code does not.
        run: python -m pip install -e ".[dev,data,persistence]"

      - name: Lint
        run: ruff check .

      - name: Unit and integration tests
        # testpaths in pyproject covers tests/ and mcp_servers/, so this runs the
        # portfolio, marketplace and workspace server suites too. conftest.py forces the
        # model offline and the embedding/reranker backends to their lightweight variants,
        # so the suite tests this system rather than a provider or a 130MB download.
        run: pytest -q

      - name: MCP tool-schema contract (A7)
        # Run explicitly as well as via pytest, so a failure here is legible in the
        # job list rather than buried in a 90-test run.
        run: pytest tests/contract -q

      - name: API contract and approval flow (D)
        run: pytest tests/integration/test_api.py -q

      - name: Graph routing, loop bounds and interrupts (C)
        run: pytest tests/integration/test_bid_graph.py tests/integration/test_conversation_graph.py -q

      - name: Part A demo runs end to end
        # The deliverable must actually work, not just be present. Runs offline (no
        # provider key in CI), which exercises every MCP path and stops at approval.
        run: python -m evals.runners.single_agent_demo --persona ai_ml_engineer

  repo-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No .env committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is committed. Only .env.example belongs in the repo."
            exit 1
          fi

      - name: No obvious secrets
        # Deliberately narrow: known provider key shapes, not a generic entropy scan
        # that would flag every hash in the seed data.
        run: |
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xoxb-[A-Za-z0-9-]{20,})' \
               -- . ':!.github/workflows/*' ':!.env.example'; then
            echo "::error::a provider key shape appears in tracked files."
            exit 1
          fi

      - name: Every prompt lives in agent/prompts/
        # The assignment forbids inline prompts in node code. Checks for triple-quoted
        # blocks that look like system prompts inside agent/nodes/.
        run: |
          if git grep -nE '(You are an? (helpful|expert|assistant)|^\s*"""You are)' -- 'agent/nodes/*' ; then
            echo "::error::inline prompt found in agent/nodes/. Move it to agent/prompts/."
            exit 1
          fi

      - name: Nothing under gigsim/ changed on this branch
        # The assignment treats gigsim/ as provided. This repo wrote its own simulator
        # (documented in docs/adr/0001-we-built-gigsim.md), so the rule is enforced
        # against the default branch rather than against an upstream copy.
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- gigsim/ || true)
          if [ -n "$changed" ]; then
            echo "::warning::gigsim/ changed in this PR:"
            echo "$changed"
          fi

      - name: Results referenced by docs exist
        # Supports the rule that every number in the README traces to evals/results/.
        run: |
          missing=0
          for f in $(grep -ohE 'evals/results/[A-Za-z0-9_./-]+\.(json|csv)' README.md docs/*.md 2>/dev/null | sort -u); do
            if [ ! -f "$f" ]; then
              echo "::error::$f is cited in the docs but does not exist."
              missing=1
            fi
          done
          exit $missing
