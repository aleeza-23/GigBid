# GigBid configuration. Every model, threshold and budget lives here, never in code.
#
# The change request on 2 November will introduce a new rule or cost affecting bidding.
# That is the reason this file exists in this shape: a new Connects rule should be a few
# lines here, not a hunt through the nodes.

marketplace:
  # The only mode switch in the system. agent/marketplace_port.py is the only reader.
  mode: gigsim          # gigsim | upwork_live
  max_requests_per_minute: 20   # under GigSim's 30, so we are never the rude caller

mcp:
  transport: stdio      # stdio locally; MCP_TRANSPORT=http in the deployed stack

models:
  # "open" is required and is what the deployed link runs on. "paid" is optional and is
  # only justified where it measurably beats open on the dev set.
  profile: open

  profiles:
    open:
      # Hosted open-weight models. The deployed link has no GPU, so a hosted provider is
      # the only way to honour "the deployed link must work on the open profile", and the
      # assignment names Groq as an acceptable one. Swap base_url for OpenRouter,
      # Together, or a local Ollama at http://localhost:11434/v1 without touching code.
      provider: groq
      base_url: https://api.groq.com/openai/v1
      # Candidates, tried in order. Groq is OpenAI-compatible, so a Groq key often ends
      # up in OPENAI_API_KEY; accepting both beats a silent fall back to offline mode.
      api_key_env: [GROQ_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY, TOGETHER_API_KEY]
      small: openai/gpt-oss-20b     # routers, classifiers, risk checks
      large: openai/gpt-oss-120b    # writer, critic, client liaison
    # A second open configuration, which the Models section requires comparing against
    # the first. It is also the fallback when the primary profile's daily quota is gone:
    # these are separate models with separate daily caps.
    open_alt:
      provider: groq
      base_url: https://api.groq.com/openai/v1
      api_key_env: [GROQ_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY, TOGETHER_API_KEY]
      small: qwen/qwen3.8-27b
      large: qwen/qwen3.8-27b
      # This model's free tier caps OUTPUT at 1000 tokens/minute, so a 2000-token
      # request is refused outright as "request too large" rather than throttled.
      max_output_tokens: 900
    # gpt-oss-120b for every node. Groq's free tier meters tokens per day PER MODEL, so
    # when the 20b daily quota is gone this profile still has its own. Used for the
    # R&D question C comparison, where all three arms must run on the same model to be
    # comparable at all.
    open_120b:
      provider: groq
      base_url: https://api.groq.com/openai/v1
      api_key_env: [GROQ_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY, TOGETHER_API_KEY]
      small: openai/gpt-oss-120b
      large: openai/gpt-oss-120b
    paid:
      provider: anthropic
      base_url: https://api.anthropic.com/v1
      api_key_env: [ANTHROPIC_API_KEY]
      small: claude-haiku-5-5
      large: claude-opus-5-5

  # Route by node (required). Cheap, frequent nodes get the small model; the Writer and
  # Critic get the strongest one affordable. "small"/"large" resolve inside the active
  # profile, so switching profile moves every node at once.
  nodes:
    scout: small
    analyst: small
    risk_assessor: small
    fit_matcher: small
    pricing: small
    verifier: small
    compliance: small
    intent: small
    writer: large
    critic: large
    client_liaison: large

  # Open models in both profiles, as required. Both run acceptably on CPU.
  embeddings: nomic-embed-text
  reranker: bge-reranker-v2-m3

  # Sampling. Low temperature everywhere: these nodes extract structure and cite
  # evidence, and creativity here shows up as fabricated experience.
  temperature: 0.2
  writer_temperature: 0.5
  max_output_tokens: 2000
  request_timeout_sec: 60
  # Groq's free tier meters tokens per minute, not requests. The client paces itself
  # against this and honours Retry-After, so a 120-call evaluation completes instead of
  # collecting refusals. Raise it if you upgrade tier (LLM_TPM_LIMIT overrides).
  tpm_limit: 8000
  max_attempts: 4

budgets:
  max_graph_steps: 30
  max_revisions: 2            # the Critic may send a draft back at most twice (C4)
  max_tokens_per_job: 12000
  max_tokens_per_proposal: 20000
  # Declared budgets, reported against in the R&D report (R8).
  p95_latency_job_analysis_sec: 25
  p95_latency_proposal_sec: 90
  usd_per_job_analysed: 0.01
  usd_per_proposal: 0.05

thresholds:
  # Keep this many Connects back rather than spending to zero. A platform rule that
  # introduces a cost or a cap lands here: the decision node reads the number, so moving
  # it is a config edit and not a code change. Set to 0 to spend the whole balance.
  connects_reserve: 8
  minimum_fit_score: 0.60
  maximum_risk_score: 0.70
  # Below this coverage the decision node skips rather than bidding, and says which
  # requirement decided it.
  minimum_requirement_coverage: 0.50
  # A client with many posts and no hires is the strongest scam signal in this corpus.
  scam_hire_rate_below: 0.05
  scam_min_posts_for_signal: 5
  # Never bid under the persona's floor, whatever the market says.
  respect_profile_floor: true

retrieval:
  # Which RAG variant ships. Chosen by measurement in Part B (R6), not by default.
  #
  # V1 is requirement decomposition over dense retrieval: one query per requirement,
  # merged by best score. It is the best measured variant on 142 labelled dev rows, at
  # 0.651 Recall@5 against 0.582 for the naive single-query baseline, for about 60 ms.
  #
  # The two components that look more sophisticated both measured worse. Hybrid BM25 plus
  # dense fusion scored 0.581, level with the baseline. Cross-encoder reranking scored
  # 0.592 and took 11.3 seconds a query, and in the ablation removing the reranker raised
  # Recall@5 by 9.8 points. V12 exists to record the combination of decomposition and
  # hybrid fusion without reranking: 0.550, worse than either alone, so it does not ship.
  #
  # `builtin_bm25` falls back to the Portfolio server's own ranker, which is what answered
  # before the evaluation had run.
  variant: V1
  k: 8
  rerank_top_n: 4
  outcome_aware: false
  # How many candidates the cross-encoder reranks. A real cross-encoder is a forward pass
  # per candidate, so this is the single biggest lever on retrieval latency: at 30 the
  # full evaluation took over an hour of CPU, at 12 it is minutes, and precision@5 rarely
  # improves from candidates ranked below 12 by the hybrid retriever.
  candidate_depth: 12
  # How many corrective re-queries V8 may make per requirement. Each one is another pass
  # over the corpus, so on a small host this is the difference between a demo that answers
  # in seconds and one that looks hung. 1 means retrieve once and grade it.
  max_corrective_rounds: 1

  embeddings:
    # Open-weight, as the assignment requires in both profiles, and small enough to run
    # on a CPU. "lsa" is a numpy-only development fallback and is NOT spec-compliant;
    # every results file records which backend produced it.
    backend: local          # local | api | lsa
    model: BAAI/bge-small-en-v1.5
    dim: 384

safety:
  # Job posts and client messages are untrusted data (E4, R9).
  delimit_untrusted_input: true
  mask_pii_in_logs: true
  injection_patterns_file: data/policy_pack/marketplace_policy.md

# ------------------------------------------------------------------ agency mode (X1)
# The signature extension: one GigBid serving a small team instead of one freelancer.
# Off by default, because routing is only honest when every member has a real portfolio
# behind them, and the single-freelancer product is what Parts A to E are measured on.
#
# Routing is by requirement coverage over each member's portfolio, not by a model's
# opinion of the post. See agent/nodes/agency.py and docs/EXTENSION.md.
agency:
  enabled: false
  members:
    - ai_ml_engineer
    - fullstack_web_developer
    - data_analyst
  # Below this coverage the team cannot do the job. The thread falls back to the default
  # member and the decision node skips on the low coverage it then sees.
  min_coverage: 0.34
  # Two members closer than this are not a routing decision. The job goes to the default
  # member and is flagged, rather than a one-requirement difference deciding who bids.
  min_margin: 0.15
